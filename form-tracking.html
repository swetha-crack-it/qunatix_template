<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Tracking Form</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f4f7f6;
            --text-color: #333;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        /* Progress Stepper */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .step {
            text-align: center;
            z-index: 1;
            flex: 1;
        }

        .step-number {
            width: 30px;
            height: 30px;
            background: #ddd;
            border-radius: 50%;
            display: inline-block;
            line-height: 30px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .step.active .step-number {
            background: var(--primary-color);
            color: white;
        }

        /* Form Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
        }

        .btn-submit {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Project Tracking Portal</h2>

    <div class="stepper">
        <div class="step active">
            <div class="step-number">1</div>
            <div class="step-label">Initiation</div>
        </div>
        <div class="step">
            <div class="step-number">2</div>
            <div class="step-label">In Progress</div>
        </div>
        <div class="step">
            <div class="step-number">3</div>
            <div class="step-label">Review</div>
        </div>
        <div class="step">
            <div class="step-number">4</div>
            <div class="step-label">Done</div>
        </div>
    </div>

    <form action="#" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="proj-name">Project / Task Name</label>
                <input type="text" id="proj-name" name="proj-name" placeholder="Enter title..." required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="development">Development</option>
                    <option value="marketing">Marketing</option>
                    <option value="design">Design</option>
                    <option value="admin">Administrative</option>
                </select>
            </div>

            <div class="form-group">
                <label for="start-date">Start Date</label>
                <input type="date" id="start-date" name="start-date">
            </div>

            <div class="form-group">
                <label for="priority">Priority Level</label>
                <select id="priority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="progress-range">Completion Percentage (%)</label>
                <input type="range" id="progress-range" name="progress-range" min="0" max="100" value="0" oninput="this.nextElementSibling.value = this.value + '%'">
                <output style="text-align: center; font-weight: bold; margin-top: 5px;">0%</output>
            </div>

            <div class="form-group full-width">
                <label for="description">Detailed Notes / Milestones</label>
                <textarea id="description" name="description" rows="4" placeholder="Describe current progress and blockers..."></textarea>
            </div>

            <div class="form-group">
                <label for="assignee">Assignee Email</label>
                <input type="email" id="assignee" name="assignee" placeholder="colleague@company.com">
            </div>

            <div class="form-group">
                <label for="attachment">Upload Documentation</label>
                <input type="file" id="attachment" name="attachment">
            </div>
        </div>

        <button type="submit" class="btn-submit">Update Tracked Record</button>
    </form>
</div>

</body>
</html>
